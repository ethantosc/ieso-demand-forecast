name: Harvest IESO forecasts

on:
  schedule:
    # 11:00 UTC = 07:00 EDT / 06:00 EST.
    # GitHub cron is always UTC and can be delayed by 10+ minutes at peak
    # times. That does not matter here: the script reconciles against the
    # remote listing, so a late run still picks up everything.
    - cron: "0 11 * * *"
  workflow_dispatch:  # lets you trigger a run by hand from the Actions tab

# The default GITHUB_TOKEN is read-only. Committing back to the repo
# requires write access.
permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false  # queue instead of cancelling, so a run is never
                             # killed after downloading but before committing

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        # No pip install step: the script uses the standard library only.

      - name: Harvest
        run: python scripts/harvest_forecasts.py

      - name: Commit new files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/forecasts
          # git commit exits non-zero when there is nothing staged, which would
          # mark every quiet day as a failed run. Check first, then commit.
          if git diff --staged --quiet; then
            echo "No new files, nothing to commit"
          else
            git commit -m "chore: harvest IESO forecasts $(date -u +%Y-%m-%d)"
            git push
          fi
